[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anythingtomarkdown"
version = "0.1.1"
description = "把任何格式的文件一键转换为 Markdown（离线）"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "markitdown[docx,xlsx,xls,pptx,pdf,outlook]>=0.1.0",
]

[project.scripts]
atm = "anythingtomarkdown.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
